apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fiapx
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: video-processor:local   # troque pelo seu registry em CI/CD
          imagePullPolicy: IfNotPresent
          command: ["./api"]
          ports:
            - containerPort: 8080
          # envFrom injeta todas as chaves do ConfigMap + Secret como variaveis de ambiente.
          envFrom:
            - configMapRef: { name: fiapx-config }
            - secretRef: { name: fiapx-secrets }
          # Probe TCP: robusta, independe do path de health.
          # Se a API expuser /healthz, troque por httpGet nesse path.
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
