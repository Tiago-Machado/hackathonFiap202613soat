# Espelha o minio-setup do compose: cria o bucket e um usuario ESCOPADO
# (privilegio minimo, so no bucket videos). A aplicacao NUNCA usa o root.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: fiapx
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: minio-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-06-12T14-34-03Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: APP_ACCESS_KEY
              valueFrom: { configMapKeyRef: { name: fiapx-config, key: S3_ACCESS_KEY } }
            - name: APP_SECRET_KEY
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_SECRET_KEY } }
            - name: BUCKET
              valueFrom: { configMapKeyRef: { name: fiapx-config, key: S3_BUCKET } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "aguardando minio..."; sleep 3
              done

              mc mb --ignore-existing local/$BUCKET

              cat > /tmp/app-policy.json <<EOF
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:PutObject","s3:GetObject","s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::$BUCKET/*"]
                  },
                  {
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket"],
                    "Resource": ["arn:aws:s3:::$BUCKET"]
                  }
                ]
              }
              EOF

              mc admin policy create local fiapx-app-policy /tmp/app-policy.json || true
              mc admin user add local "$APP_ACCESS_KEY" "$APP_SECRET_KEY" || true
              mc admin policy attach local fiapx-app-policy --user "$APP_ACCESS_KEY" || true
              echo "minio-setup concluido"
