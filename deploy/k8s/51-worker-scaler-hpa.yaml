# ALTERNATIVA sem dependencia externa: escala o worker por CPU.
# Use ISTO **ou** o KEDA (51-worker-scaler-keda.yaml), NUNCA os dois juntos
# (o KEDA cria seu proprio HPA e os dois entrariam em conflito).
#
# Trade-off: CPU e um sinal indireto do backlog. Sobe rapido no meio de um
# ffmpeg pesado, mas nao "enxerga" videos parados na fila esperando um worker
# livre. Serve como plano B garantido quando o cluster nao tem KEDA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
