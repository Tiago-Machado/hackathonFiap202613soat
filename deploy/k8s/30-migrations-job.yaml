# Roda as migrations ANTES da API/worker subirem.
# As migrations sao entregues via ConfigMap gerado a partir da sua pasta migrations/:
#   kubectl create configmap fiapx-migrations \
#     --from-file=migrations/ -n fiapx --dry-run=client -o yaml | kubectl apply -f -
#
# >>> VERIFICAR: este Job assume golang-migrate (arquivos NNNN_nome.up.sql / .down.sql).
#     Se o migration-runner do seu compose usa outro mecanismo, alinhe a imagem/comando.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrations
  namespace: fiapx
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: db-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -p 5432 -U fiapx; do echo "aguardando postgres..."; sleep 2; done
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: DATABASE_URL } }
          args:
            - -path=/migrations
            - -database=$(DATABASE_URL)
            - up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: fiapx-migrations
