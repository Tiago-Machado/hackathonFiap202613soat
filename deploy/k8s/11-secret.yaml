# Segredos. Em producao real isto viria de um SealedSecret / External Secrets / Vault,
# nunca versionado em texto puro — vale registrar essa decisao no video.
# Troque TODAS as senhas antes de qualquer uso real.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
  namespace: fiapx
type: Opaque
stringData:
  # --- DSNs montadas (contem senha => vao no Secret, nao no ConfigMap) ---
  # Formato consumido pelo binario. Confira sslmode/vhost contra seu docker-compose.yml.
  DATABASE_URL: "postgres://fiapx:troque-esta-senha@postgres:5432/fiapx?sslmode=disable"
  RABBITMQ_URL: "amqp://fiapx:troque-esta-senha@rabbitmq:5672/"

  # Credencial ESCOPADA da aplicacao (privilegio minimo no bucket videos).
  S3_SECRET_KEY: "troque-esta-senha-app"

  # openssl rand -hex 32
  JWT_SECRET: "gere-um-segredo-longo-e-aleatorio-de-32-bytes-ou-mais"

  # --- Credenciais nativas dos servicos de apoio (usadas pelos StatefulSets) ---
  POSTGRES_USER: "fiapx"
  POSTGRES_PASSWORD: "troque-esta-senha"
  POSTGRES_DB: "fiapx"

  RABBITMQ_DEFAULT_USER: "fiapx"
  RABBITMQ_DEFAULT_PASS: "troque-esta-senha"

  # Root do MinIO — usado SO pelo Job de setup, nunca pela aplicacao.
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "troque-esta-senha-root"
