# Conjunto base — aplica com: kubectl apply -k deploy/k8s
# NAO inclui o migrations-job (depende do ConfigMap fiapx-migrations, criado a mao),
# nem os scalers de worker nem o ingress — sao opt-in, veja o README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiapx
resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 11-secret.yaml
  - 20-postgres.yaml
  - 21-rabbitmq.yaml
  - 22-redis.yaml
  - 23-minio.yaml
  - 24-minio-setup-job.yaml
  - 40-api.yaml
  - 41-api-hpa.yaml
  - 50-worker.yaml
