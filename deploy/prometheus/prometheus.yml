global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]   # worker expõe /metrics numa porta interna

  # RabbitMQ já traz o plugin rabbitmq_prometheus na imagem -management (porta 15692).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # MinIO expõe métricas em /minio/v2/metrics/cluster.
  # MINIO_PROMETHEUS_AUTH_TYPE=public (no compose) libera o scrape sem token em dev.
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
