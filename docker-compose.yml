# =============================================================================
# FIAP X — núcleo (infra + aplicação). Ambiente de desenvolvimento.
#
#   cp .env.example .env
#   docker compose up --build
#   docker compose up --build --scale worker=3        # vários workers
#
# Overlays (combine com -f):
#   Observabilidade: -f docker-compose.yml -f docker-compose.observability.yml
#   Produção/TLS:    -f docker-compose.yml -f docker-compose.prod.yml
# =============================================================================

name: fiapx-video

# Config compartilhada entre API e Worker. Note: a app NÃO usa as credenciais
# ROOT do MinIO — usa um usuário escopado (APP_S3_*) criado pelo minio-setup.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  S3_INTERNAL_ENDPOINT: minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY}
  S3_SECRET_KEY: ${APP_S3_SECRET_KEY}
  S3_BUCKET: ${MINIO_BUCKET}
  S3_USE_SSL: "false"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  JWT_SECRET: ${JWT_SECRET}
  PRESIGN_EXPIRY: "15m"
  RETENTION_DAYS: ${RETENTION_DAYS}

services:
  # ---- Infraestrutura -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # painel de gerência
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public   # libera /metrics sem token (dev)
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks: [internal]

  # Cria bucket, usuário ESCOPADO (privilégio mínimo) e regra de expiração.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./deploy/minio/app-policy.json:/policies/app-policy.json:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'aguardando MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc admin user add local ${APP_S3_ACCESS_KEY} ${APP_S3_SECRET_KEY} || true;
      mc admin policy create local app-rw /policies/app-policy.json || true;
      mc admin policy attach local app-rw --user ${APP_S3_ACCESS_KEY} || true;
      mc ilm rule add --expire-days '${RETENTION_DAYS}' local/${MINIO_BUCKET} || true;
      echo 'MinIO configurado (bucket + usuario escopado + retencao).';
      "
    networks: [internal]

  # Migrations versionadas — rodam ANTES da app subir. Substitui o initdb.
  migrate:
    image: migrate/migrate:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    networks: [internal]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [internal]

  # ---- Aplicação ------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  rabbitmqdata:
  miniodata:
