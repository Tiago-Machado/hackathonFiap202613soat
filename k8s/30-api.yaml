apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-migrate
          image: bitnami/kubectl:latest
          command: ["kubectl", "wait", "--for=condition=complete", "job/migrate", "-n", "fiapx", "--timeout=180s"]
      containers:
        - name: api
          image: fiapx-video:local
          imagePullPolicy: IfNotPresent
          command: ["./api"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      serviceAccountName: job-waiter
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fiapx
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
